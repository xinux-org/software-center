[package]
name = "nix-software-center"
version = "0.1.4"
edition = "2024"
default-run = "nix-software-center"
authors = [
  "Sokhibjon Orzikulov <sakhib@orzklv.uz>",
  "Victor Fuentes <vlinkz@snowflakeos.org>",
]

[dependencies]
# GNOME crates
relm4 = { version = "0.11.0", features = ["libadwaita", "macros", "gnome_50"] }
relm4-components = { package = "relm4-components", version = "0.11.0" }
sourceview5 = { version = "0.11.0" }

gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
nix-editor = "0.3.0"
nix-data-xinux = "0.0.6"
tokio = { version = "1.52.3", features = [
  "rt",
  "macros",
  "time",
  "rt-multi-thread",
  "sync",
  "process",
] }
tracker = "0.2"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "sqlite"] }
html2pango = "0.6"
log = "0.4.32"
pretty_env_logger = "0.5"
flate2 = "1.1.8"
quick-xml = { version = "0.40.1", features = ["serialize"] }
rand = "0.10.1"
reqwest = { version = "0.13.1", features = ["blocking"] }
sha256 = "1.6.0"
image = "0.25.9"
spdx = "0.13.3"
anyhow = "1.0.102"
xdg = "3.0.0"
toml = "1.1.2"
clap = { version = "4.6.1", features = ["cargo", "derive"] }
regex = "1.12.4"
zbus = "5.17.0"

[workspace]
members = [".", "nsc-helper"]
default-members = [".", "nsc-helper"]
