[package]
name = "nix-software-center"
version = "0.4.0"
edition = "2024"
default-run = "nix-software-center"
authors = [
  "Sokhibjon Orzikulov <sakhib@orzklv.uz>",
  "Victor Fuentes <vlinkz@snowflakeos.org>",
]

[dependencies]
# GNOME crates
relm4 = { version = "0.11.0", features = ["libadwaita", "macros", "gnome_50"] }
relm4-components = { package = "relm4-components", version = "0.11.0" }
sourceview5 = { version = "0.11.2" }

gettext-rs = { version = "0.8", features = ["gettext-system"] }
nix-editor = "0.3.0"
nix-data-xinux = "0.0.7"
tokio = { version = "1.52.3", features = [
  "rt",
  "macros",
  "time",
  "rt-multi-thread",
  "sync",
  "process",
] }
tracker = "0.2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-native-tls", "sqlite"] }
html2pango = "0.6"
log = "0.4"
pretty_env_logger = "0.5"
flate2 = "1.1.8"
quick-xml = { version = "0.41", features = ["serialize"] }
rand = "0.10"
reqwest = { version = "0.13", features = ["blocking"] }
sha256 = "1.6"
image = "0.25.9"
spdx = "0.13.5"
anyhow = "1.0"
xdg = "3.0.0"
toml = "1.1.4"
clap = { version = "4.6", features = ["cargo", "derive"] }
winnow = "1.0.3"
relm4-icons = "0.11"
chrono = { version = "0.4", features = ["serde"] }
enum-assoc = "1.4.0"

[build-dependencies]
relm4-icons-build = "0.11.0"

[workspace]
members = [".", "nsc-helper"]
default-members = [".", "nsc-helper"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Lint groups
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -2 }

# Error handling
unwrap_used = "deny"
expect_used = "warn"
map_err_ignore = "deny"
result_large_err = "warn"
option_if_let_else = "warn"
# Panic-safety
panic = "deny"
todo = "warn"                     
unimplemented = "warn"         
unreachable = "warn"           
indexing_slicing = "warn"       
arithmetic_side_effects = "warn"  
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
lossy_float_literal = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
